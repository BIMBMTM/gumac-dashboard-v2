<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GUMAC Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>

<style>
:root{--bg:#f7f8fb;--surface:#fff;--border:rgba(15,23,42,0.06);--text:#0f172a;--sub:#475569;--muted:#94a3b8;--blue:#5b8def;--purple:#b89cf0;--pink:#ed9ebe;--green:#6dc88a;--amber:#d4a849;--red:#e57878;--sidebar-w:240px;}
*{-webkit-font-smoothing:antialiased;box-sizing:border-box;}
body{font-family:'Inter',-apple-system,sans-serif;margin:0;color:var(--text);background:var(--bg);background-image:radial-gradient(at 8% 0%,rgba(199,218,252,.45) 0,transparent 50%),radial-gradient(at 92% 6%,rgba(247,200,220,.35) 0,transparent 50%),radial-gradient(at 50% 100%,rgba(217,200,247,.3) 0,transparent 50%);background-attachment:fixed;min-height:100vh;}
.df{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.022em;}
.ticker{font-variant-numeric:tabular-nums;}
.surface{background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.03),0 8px 24px -12px rgba(15,23,42,.06);}
.surface-el{background:var(--surface);border-radius:24px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.03),0 12px 40px -16px rgba(15,23,42,.10),0 2px 8px -2px rgba(15,23,42,.04);}
.glass{background:rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.4);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) backwards;}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink),var(--purple),var(--blue));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s ease-in-out;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.1);border-radius:4px;}
/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;overflow-y:auto;}
.main-area{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;cursor:pointer;transition:all .15s;color:var(--sub);font-size:13px;font-weight:500;margin:1px 8px;}
.nav-item:hover{background:rgba(91,141,239,.06);color:var(--blue);}
.nav-item.active{background:linear-gradient(135deg,rgba(91,141,239,.12),rgba(184,156,240,.08));color:var(--blue);font-weight:600;}
.nav-item.active .nav-icon{color:var(--blue);}
.nav-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 24px 4px;}
/* Login */
.login-bg{background:radial-gradient(at 20% 30%,rgba(147,182,245,.5) 0,transparent 50%),radial-gradient(at 80% 70%,rgba(237,158,190,.45) 0,transparent 50%),radial-gradient(at 50% 50%,rgba(184,156,240,.4) 0,transparent 50%),var(--bg);}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;transition:all .2s;box-shadow:0 4px 14px rgba(91,141,239,.3);border:none;cursor:pointer;font-family:inherit;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,141,239,.4);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.input-soft{background:rgba(247,248,251,.8);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;transition:all .2s;color:var(--text);font-family:inherit;outline:none;}
.input-soft:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,141,239,.08);}
.input-soft::placeholder{color:var(--muted);}
.recharts-tooltip-wrapper{outline:none!important;}
.recharts-cartesian-grid-horizontal line,.recharts-cartesian-grid-vertical line{stroke:rgba(15,23,42,.05);}
</style>
</head>
