<style>
:root{--bg:#f7f8fb;--surface:#fff;--border:rgba(15,23,42,0.06);--text:#0f172a;--sub:#475569;--muted:#94a3b8;--blue:#5b8def;--purple:#b89cf0;--pink:#ed9ebe;--green:#6dc88a;--amber:#d4a849;--red:#e57878;--sidebar-w:240px;}

body{font-family:'Inter',-apple-system,sans-serif;margin:0;color:var(--text);background:var(--bg);background-image:radial-gradient(at 8% 0%,rgba(199,218,252,.45) 0,transparent 50%),radial-gradient(at 92% 6%,rgba(247,200,220,.35) 0,transparent 50%),radial-gradient(at 50% 100%,rgba(217,200,247,.3) 0,transparent 50%);background-attachment:fixed;min-height:100vh;}
.df{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.022em;}
.ticker{font-variant-numeric:tabular-nums;}
.surface{background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.03),0 8px 24px -12px rgba(15,23,42,.06);}

.glass{background:rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.4);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) backwards;}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.shimmer{background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink),var(--purple),var(--blue));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s ease-in-out;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.1);border-radius:4px;}
/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;overflow-y:auto;}
.main-area{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;cursor:pointer;transition:all .15s;color:var(--sub);font-size:13px;font-weight:500;margin:1px 8px;}
.nav-item:hover{background:rgba(91,141,239,.06);color:var(--blue);}
.nav-item.active{background:linear-gradient(135deg,rgba(91,141,239,.12),rgba(184,156,240,.08));color:var(--blue);font-weight:600;}
.nav-item.active .nav-icon{color:var(--blue);}
.nav-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 24px 4px;}
/* Login */
.login-bg{background:radial-gradient(at 20% 30%,rgba(147,182,245,.5) 0,transparent 50%),radial-gradient(at 80% 70%,rgba(237,158,190,.45) 0,transparent 50%),radial-gradient(at 50% 50%,rgba(184,156,240,.4) 0,transparent 50%),var(--bg);}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:14px;padding:12px 20px;font-weight:600;font-size:14px;transition:all .2s;box-shadow:0 4px 14px rgba(91,141,239,.3);border:none;cursor:pointer;font-family:inherit;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(91,141,239,.4);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.input-soft{background:rgba(247,248,251,.8);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;transition:all .2s;color:var(--text);font-family:inherit;outline:none;}
.input-soft:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,141,239,.08);}
.input-soft::placeholder{color:var(--muted);}
.recharts-tooltip-wrapper{outline:none!important;}
.recharts-cartesian-grid-horizontal line,.recharts-cartesian-grid-vertical line{stroke:rgba(15,23,42,.05);}

async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function decrypt(enc,pwd){
  try{
    const km=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
    const key=await crypto.subtle.importKey('raw',km,{name:'AES-GCM'},false,['decrypt']);
    const data=Uint8Array.from(atob(enc),c=>c.charCodeAt(0));
    const iv=data.slice(0,12),authTag=data.slice(12,28),ct=data.slice(28);
    const combined=new Uint8Array(ct.length+authTag.length);
    combined.set(ct);combined.set(authTag,ct.length);
    const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,combined);
    return new TextDecoder().decode(dec);
  }catch{return null;}
}

// ============ HELPERS ============
const pN=v=>{if(!v&&v!==0)return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/[₫\sVNDđ%]/gi,'');if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(s.includes('.')&&!s.includes(',')&&s.split('.').length>2)s=s.replace(/\./g,'');else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n;};
const pD=v=>{if(!v)return null;const s=String(v).trim();const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m1){let[,d,m,y]=m1;if(y.length===2)y='20'+y;return new Date(parseInt(y),parseInt(m)-1,parseInt(d));}const m2=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})T/);if(m2)return new Date(parseInt(m2[1]),parseInt(m2[2])-1,parseInt(m2[3]));const m3=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m3)return new Date(parseInt(m3[1]),parseInt(m3[2])-1,parseInt(m3[3]));const d=new Date(s);return isNaN(d.getTime())?null:d;};
const fN=(n,d=0)=>n==null||isNaN(n)?'0':n.toLocaleString('vi-VN',{maximumFractionDigits:d,minimumFractionDigits:d});
const fK=n=>{if(!n&&n!==0)return'0';const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(2)+'tỷ';if(a>=1e6)return(n/1e6).toFixed(1)+'tr';if(a>=1e3)return(n/1e3).toFixed(1)+'k';return fN(n);};
const fPct=(n,d=2)=>n==null||isNaN(n)?'0%':(n*100).toFixed(d)+'%';
const fDate=d=>d?`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`:'';
const fDateFull=d=>d?`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`:'';
const pctChg=(a,b)=>(!b||b===0)?null:((a-b)/b)*100;
const iDate=d=>d?`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`:'';

const IStar=p=><Ic {...p} d={<path d="M12 3l1.88 5.76a2 2 0 0 0 1.36 1.36L21 12l-5.76 1.88a2 2 0 0 0-1.36 1.36L12 21l-1.88-5.76a2 2 0 0 0-1.36-1.36L3 12l5.76-1.88a2 2 0 0 0 1.36-1.36L12 3z"/>}/>;

const ILogout=p=><Ic {...p} d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>}/>;
const IFilter=p=><Ic {...p} d={<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>}/>;
const IChart=p=><Ic {...p} d={<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>}/>;
const IAlert=p=><Ic {...p} d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>}/>;
const ICheck=p=><Ic {...p} d={<polyline points="20 6 9 17 4 12"/>}/>;
const IUpload=p=><Ic {...p} d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>}/>;

// ============ SHARED COMPONENTS ============
function DeltaBadge({v,suffix='%'}){
  if(v==null)return<span style={{color:'var(--muted)',fontSize:11}}>—</span>;
  const up=v>0,dn=v<0,col=up?'var(--green)':dn?'var(--red)':'var(--muted)';
  return<span style={{color:col,fontSize:11,fontWeight:600,display:'inline-flex',alignItems:'center',gap:2}}>
    {up?<IUp s={11} sw={2.5}/>:dn?<IDown s={11} sw={2.5}/>:<IMinus s={11} sw={2.5}/>}
    {v>0?'+':''}{v.toFixed(1)}{suffix}
  </span>;
}
function KpiCard({label,value,sub,change,accent,delay=0}){

// ============ LOGIN ============
function LoginGate({onSuccess}){
  const[pwd,setPwd]=useState('');const[show,setShow]=useState(false);
  const[err,setErr]=useState('');const[loading,setLoading]=useState(false);const[shake,setShake]=useState(false);
  const ref=useRef();
  useEffect(()=>{ref.current&&ref.current.focus();},[]);
  const submit=async e=>{
    if(e)e.preventDefault();
    const t=pwd.trim();
    if(!t){setErr('Vui lòng nhập mật khẩu.');setShake(true);setTimeout(()=>setShake(false),500);return;}
    setLoading(true);
    try{
      const h=await sha256(t);
      if(h===PASSWORD_HASH){
        const[mainUrl,socialUrl]=await Promise.all([decrypt(ENC_MAIN,t),decrypt(ENC_SOCIAL,t)]);
        if(!mainUrl||!socialUrl){setErr('Lỗi giải mã.');setLoading(false);return;}
        try{const ex=Date.now()+SESSION_HOURS*3600*1000;sessionStorage.setItem(SESSION_KEY,JSON.stringify({ok:true,expiry:ex,k:t}));}catch{}
        onSuccess({mainUrl,socialUrl,pwd:t});
      }else{
        setErr('Mật khẩu không đúng.');setShake(true);setTimeout(()=>setShake(false),500);
        ref.current&&ref.current.select();
      }
    }catch(e){setErr('Lỗi: '+e.message);}
    finally{setLoading(false);}
  };
  return<div className="login-bg" style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
    <div className={shake?'shake':''} style={{width:'100%',maxWidth:420}}>
      <div className="surface-el glass fu" style={{padding:36}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:60,height:60,borderRadius:18,background:'linear-gradient(135deg,#c7dafc,#d9c8f7,#f7c8dc)',margin:'0 auto 16px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 8px 24px rgba(184,156,240,.3)'}}>
            <ILock s={26} c="text-white" sw={2.5}/>
          </div>
          <div className="df shimmer" style={{fontSize:22,fontWeight:800}}>GUMAC Analytics</div>
          <div style={{fontSize:13,color:'var(--muted)',marginTop:6}}>Nhập mật khẩu để truy cập</div>
        </div>
        <form onSubmit={submit}>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--sub)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Mật khẩu</div>
            <div style={{position:'relative'}}>
              <input ref={ref} type={show?'text':'password'} value={pwd} onChange={e=>{setPwd(e.target.value);setErr('');}}
                className="input-soft" style={{width:'100%',paddingRight:44,fontSize:15}} placeholder="Nhập mật khẩu..."/>
              <button type="button" onClick={()=>setShow(!show)}
                style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',width:32,height:32,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:'none',border:'none',cursor:'pointer',color:'var(--muted)'}}>
                {show?<IEyeOff s={17}/>:<IEye s={17}/>}
              </button>
            </div>
            {err&&<div style={{marginTop:8,fontSize:12,color:'var(--red)',display:'flex',alignItems:'center',gap:6}}><IAlert s={12}/>{err}</div>}
          </div>
          <button type="submit" disabled={loading} className="btn-primary" style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
            {loading?<><IRefresh s={15} c="spin"/>Đang xác thực...</>:<><IStar s={15}/>Truy cập Dashboard</>}
          </button>
        </form>
        <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid rgba(15,23,42,.05)',textAlign:'center',fontSize:11,color:'var(--muted)'}}>Phiên đăng nhập: {SESSION_HOURS} giờ</div>
      </div>
    </div>
  </div>;
}

// ============ MAIN APP ============
function App(){
  const[authed,setAuthed]=useState(false);
  const[urls,setUrls]=useState(null);
  const[restoring,setRestoring]=useState(true);
  const[activeMenu,setActiveMenu]=useState('overview');

  useEffect(()=>{
    (async()=>{
      try{
        const s=sessionStorage.getItem(SESSION_KEY);
        if(!s){setRestoring(false);return;}
        const{ok,expiry,k}=JSON.parse(s);

            <div style={{fontSize:10,color:'var(--muted)',fontWeight:500}}>Analytics Platform</div>
          </div>
        </div>
      </div>

      <div style={{padding:'0 0 8px'}}>
        <div className="nav-section">Menu</div>
        {MENU.map(m=>(
          <div key={m.id} className={`nav-item${activeMenu===m.id?' active':''}`} onClick={()=>setActiveMenu(m.id)}>
            <span style={{color:'inherit'}}>{m.icon}</span>

  </div>;
}

const getGrp=(t,c,a)=>{if(t&&c&&a)return'B1';if(t&&c&&!a)return'B2';if(t&&!c&&a)return'B3';if(t&&!c&&!a)return'B4';if(!t&&c&&a)return'B5';if(!t&&c&&!a)return'B6';if(!t&&!c&&a)return'B7';return'B8';};

function OverviewModule({csvUrl}){
  const[rawData,setRawData]=useState([]);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  const[fRegion,setFRegion]=useState('all');

  const[preset,setPreset]=useState('this_month');
  const[chartMetric,setChartMetric]=useState('dthu');
  const[dailyPage,setDailyPage]=useState(0);

  const fk=(row,cands)=>{const ks=Object.keys(row);for(const c of cands){const t=c.toLowerCase().replace(/\s+/g,' ').trim();const k=ks.find(k=>k.toLowerCase().replace(/\s+/g,' ').trim()===t);if(k)return k;}for(const c of cands){const t=c.toLowerCase().replace(/\s+/g,' ').trim();const k=ks.find(k=>k.toLowerCase().replace(/\s+/g,' ').trim().includes(t));if(k)return k;}return null;};
  const norm=row=>{const k=c=>fk(row,c);return{date:pD(row[k(['NGÀY','NGAY','Date'])]),branch:(row[k(['TÊN CHI NHÁNH','CHI NHÁNH'])]||'').toString().trim(),region:(row[k(['Vùng','Vung'])]||'N/A').toString().trim(),storeType:(row[k(['Loại cửa hàng','Loai cua hang'])]||'N/A').toString().trim(),dthuT:pN(row[k(['DTHU MỤC TIÊU','DOANH THU MỤC TIÊU'])]),donT:pN(row[k(['ĐƠN HÀNG MỤC TIÊU'])]),spT:pN(row[k(['SỐ SẢN PHẨM MỤC TIÊU','SẢN PHẨM MỤC TIÊU'])]),trafficT:pN(row[k(['TRAFFIC MỤC TIÊU'])]),atvT:pN(row[k(['ATV MỤC TIÊU'])]),uptT:pN(row[k(['UPT MỤC TIÊU'])]),crvT:pN(row[k(['CRV MỤC TIÊU'])]),dthuA:pN(row[k(['DTHU đạt','DTHU dat'])]),donA:pN(row[k(['ĐƠN HÀNG đạt','DON HANG dat'])]),spA:pN(row[k(['SẢN PHẨM đạt'])]),trafficA:pN(row[k(['TRAFFIC Đạt','TRAFFIC đạt'])]),atvA:pN(row[k(['ATV đạt'])]),uptA:pN(row[k(['UPT đạt'])]),crvA:pN(row[k(['CRV đạt'])]),};};

  const fetchData=useCallback(async()=>{
    if(!csvUrl)return;
    setLoading(true);setMsg('');
    const proxies=[{n:'direct',u:csvUrl},{n:'corsproxy',u:`https://corsproxy.io/?${encodeURIComponent(csvUrl)}`},{n:'allorigins',u:`https://api.allorigins.win/raw?url=${encodeURIComponent(csvUrl)}`}];
    for(const p of proxies){
      try{
        const r=await fetch(p.u,{redirect:'follow'});if(!r.ok)continue;

    }

  },[csvUrl]);

  useEffect(()=>{fetchData();},[fetchData]);

  const toID=d=>d?`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`:'';

  useEffect(()=>{
    if(!rawData.length||preset==='custom')return;
    const mx=new Date(Math.max(...rawData.map(r=>r.date.getTime())));
    const mn=new Date(Math.min(...rawData.map(r=>r.date.getTime())));
    let f,t;
    if(preset==='this_month'){f=new Date(mx.getFullYear(),mx.getMonth(),1);t=mx;}
    else if(preset==='last_7'){t=mx;f=new Date(mx);f.setDate(mx.getDate()-6);}
    else if(preset==='last_30'){t=mx;f=new Date(mx);f.setDate(mx.getDate()-29);}
    else if(preset==='last_month'){f=new Date(mx.getFullYear(),mx.getMonth()-1,1);t=new Date(mx.getFullYear(),mx.getMonth(),0);}
    else{f=mn;t=mx;}
    setDateFrom(toID(f));setDateTo(toID(t));
  },[rawData,preset]);

  const{curData,prevData,dateRange,prevRange}=useMemo(()=>{
    if(!rawData.length||!dateFrom||!dateTo)return{curData:[],prevData:[],dateRange:null,prevRange:null};
    const cs=new Date(dateFrom+'T00:00:00'),ce=new Date(dateTo+'T23:59:59');
    const ps=new Date(cs);ps.setMonth(ps.getMonth()-1);
    const pe=new Date(ce);pe.setMonth(pe.getMonth()-1);
    return{curData:rawData.filter(r=>r.date>=cs&&r.date<=ce),prevData:rawData.filter(r=>r.date>=ps&&r.date<=pe),dateRange:[cs,ce],prevRange:[ps,pe]};
  },[rawData,dateFrom,dateTo]);

  const regions=useMemo(()=>[...new Set(rawData.map(r=>r.region))].filter(Boolean).sort(),[rawData]);
  const storeTypes=useMemo(()=>[...new Set(rawData.map(r=>r.storeType))].filter(Boolean).sort(),[rawData]);
  const branches=useMemo(()=>{let l=rawData;if(fRegion!=='all')l=l.filter(r=>r.region===fRegion);if(fType!=='all')l=l.filter(r=>r.storeType===fType);return[...new Set(l.map(r=>r.branch))].filter(Boolean).sort();},[rawData,fRegion,fType]);

  const af=d=>d.filter(r=>(fRegion==='all'||r.region===fRegion)&&(fType==='all'||r.storeType===fType)&&(fBranch==='all'||r.branch===fBranch));
  const filtered=useMemo(()=>af(curData),[curData,fRegion,fType,fBranch]);
  const filteredP=useMemo(()=>af(prevData),[prevData,fRegion,fType,fBranch]);

  const agg=d=>{const a={dthuT:0,donT:0,spT:0,trafficT:0,dthuA:0,donA:0,spA:0,trafficA:0};d.forEach(r=>{a.dthuT+=r.dthuT;a.donT+=r.donT;a.spT+=r.spT;a.trafficT+=r.trafficT;a.dthuA+=r.dthuA;a.donA+=r.donA;a.spA+=r.spA;a.trafficA+=r.trafficA;});a.atvA=a.donA?a.dthuA/a.donA:0;a.atvT=a.donT?a.dthuT/a.donT:0;a.uptA=a.donA?a.spA/a.donA:0;a.uptT=a.donT?a.spT/a.donT:0;a.crvA=a.trafficA?(a.donA/a.trafficA)*100:0;a.crvT=a.trafficT?(a.donT/a.trafficT)*100:0;return a;};
  const cur=useMemo(()=>agg(filtered),[filtered]);

  const compareTable=useMemo(()=>{
    const fmt=(k,v)=>{if(k==='dthu'||k==='atv')return fK(v);if(k==='crv')return fN(v,2)+'%';if(k==='upt')return fN(v,2);return fN(v);};

      {k:'don',l:'Đơn hàng',a:cur.donA,t:cur.donT,pa:prev.donA},
      {k:'sp',l:'Sản phẩm',a:cur.spA,t:cur.spT,pa:prev.spA},
      {k:'traffic',l:'Traffic',a:cur.trafficA,t:cur.trafficT,pa:prev.trafficA},
      {k:'atv',l:'ATV',a:cur.atvA,t:cur.atvT,pa:prev.atvA},
      {k:'upt',l:'UPT',a:cur.uptA,t:cur.uptT,pa:prev.uptA},
      {k:'crv',l:'CRV (%)',a:cur.crvA,t:cur.crvT,pa:prev.crvA},
    ].map(m=>({...m,aD:fmt(m.k,m.a),tD:fmt(m.k,m.t),pD:fmt(m.k,m.pa),vsMT:pctChg(m.a,m.t),vsCK:pctChg(m.a,m.pa),pct:m.t?(m.a/m.t)*100:null}));
  },[cur,prev]);

  const dailyAgg=useMemo(()=>{
    const map=new Map();
    filtered.forEach(r=>{const k=r.date.toISOString().slice(0,10);if(!map.has(k))map.set(k,{date:r.date,dthuA:0,donA:0,spA:0,trafficA:0,dthuT:0,donT:0,spT:0,trafficT:0});const e=map.get(k);e.dthuA+=r.dthuA;e.donA+=r.donA;e.spA+=r.spA;e.trafficA+=r.trafficA;e.dthuT+=r.dthuT;e.donT+=r.donT;e.spT+=r.spT;e.trafficT+=r.trafficT;});
    return[...map.values()].sort((a,b)=>b.date-a.date).map(e=>{
      const atvA=e.donA?e.dthuA/e.donA:0,atvT=e.donT?e.dthuT/e.donT:0,uptA=e.donA?e.spA/e.donA:0,uptT=e.donT?e.spT/e.donT:0,crvA=e.trafficA?(e.donA/e.trafficA)*100:0,crvT=e.trafficT?(e.donT/e.trafficT)*100:0;
      return{...e,atvA,atvT,uptA,uptT,crvA,crvT,pct_dthu:e.dthuT?(e.dthuA/e.dthuT)*100:null,pct_don:e.donT?(e.donA/e.donT)*100:null,pct_sp:e.spT?(e.spA/e.spT)*100:null,pct_traffic:e.trafficT?(e.trafficA/e.trafficT)*100:null,pct_atv:atvT?(atvA/atvT)*100:null,pct_upt:uptT?(uptA/uptT)*100:null,pct_crv:crvT?(crvA/crvT)*100:null};
    });
  },[filtered]);

  const dailySeries=useMemo(()=>[...dailyAgg].reverse().map(e=>({...e,label:fDate(e.date)})),[dailyAgg]);

  const branchClass=useMemo(()=>{
    const m=new Map();
    filtered.forEach(r=>{if(!m.has(r.branch))m.set(r.branch,{branch:r.branch,region:r.region,storeType:r.storeType,dthuA:0,donA:0,spA:0,trafficA:0,dthuT:0,donT:0,spT:0,trafficT:0});const e=m.get(r.branch);e.dthuA+=r.dthuA;e.donA+=r.donA;e.spA+=r.spA;e.trafficA+=r.trafficA;e.dthuT+=r.dthuT;e.donT+=r.donT;e.spT+=r.spT;e.trafficT+=r.trafficT;});
    return[...m.values()].map(e=>{
      const tR=e.trafficT?e.trafficA/e.trafficT:0,cA=e.trafficA?(e.donA/e.trafficA)*100:0,cT=e.trafficT?(e.donT/e.trafficT)*100:0,cR=cT?cA/cT:0,aA=e.donA?e.dthuA/e.donA:0,aT=e.donT?e.dthuT/e.donT:0,aR=aT?aA/aT:0;
      const tD=tR>=1,cD=cR>=1,aD=aR>=1;

  },[filtered]);

  const grpSummary=useMemo(()=>{const o={};Object.keys(G_INFO).forEach(g=>o[g]=[]);branchClass.forEach(b=>{if(o[b.group])o[b.group].push(b);});return o;},[branchClass]);
  const branchRank=useMemo(()=>[...branchClass].sort((a,b)=>b.dthuA-a.dthuA),[branchClass]);

  const CMCFG={dthu:{l:'Doanh thu',col:'#5b8def',isCurrency:true},don:{l:'Đơn hàng',col:'#ed9ebe'},sp:{l:'Sản phẩm',col:'#b89cf0'},traffic:{l:'Traffic',col:'#d4a849'},atv:{l:'ATV',col:'#6dc88a',isCurrency:true},upt:{l:'UPT',col:'#5b8def',isDec:true},crv:{l:'CRV',col:'#e57878',isPct:true}};

      <div style={{marginBottom:12}}>

// MODULE 2: KÊNH SOCIAL
// ============================================================
function SocialModule({csvUrl}){
  const[rawData,setRawData]=useState([]);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  const[fPage,setFPage]=useState('all');
  const[fType,setFType]=useState('all');
  const[dateFrom,setDateFrom]=useState('');
  const[dateTo,setDateTo]=useState('');
  const[preset,setPreset]=useState('this_month');
  const[chartMetric,setChartMetric]=useState('reach');

  // Normalize social row
  const norm=row=>{
    const ks=Object.keys(row);
    const fk=(...cands)=>{for(const c of cands){const t=c.toLowerCase().trim();const k=ks.find(k=>k.toLowerCase().trim()===t||k.toLowerCase().trim().includes(t));if(k)return k;}return null;};
    const postId=row[fk('ID bài viết','post id')]||'';
    const pageId=row[fk('ID Trang','page id')]||'';
    const pageName=row[fk('Tên Trang','Tên trang','page name')]||'';
    const title=row[fk('Tiêu đề','title')]||'';
    const permalink=row[fk('Liên kết vĩnh viễn','permalink')]||'';
    const isCross=row[fk('Là nội dung đăng chéo')]||'';
    const isShare=row[fk('Là bài viết chia sẻ')]||'';
    const postType=row[fk('Loại bài viết','post type')]||'';
    const sponsoredStatus=row[fk('Trạng thái nội dung được tài trợ')]||'';
    const dateStr=row[fk('Thời gian đăng','publish time','Ngày','date')]||row[fk('Ngày')]||'';
    const dateVal=row[fk('Ngày','date')]||row[fk('Thời gian đăng')]||'';
    // Ưu tiên cột Ngày vì Thời gian đăng có thể chứa datetime dài
    const date=pD(dateVal)||pD(dateStr);
    const views=pN(row[fk('Lượt xem','views','impressions')]);
    const reach=pN(row[fk('Số người tiếp cận','reach')]);
    const totalEngage=pN(row[fk('Cảm xúc, bình luận và lượt chia sẻ','total engagement','total interactions')]);
    const reactions=pN(row[fk('Cảm xúc','reactions','likes')]);
    const comments=pN(row[fk('Bình luận','comments')]);
    const shares=pN(row[fk('Lượt chia sẻ','shares')]);
    const totalClicks=pN(row[fk('Tổng lượt click','total clicks')]);
    const photoClicks=pN(row[fk('Photo Click','photo clicks')]);
    const otherClicks=pN(row[fk('Lượt click khác','other clicks')]);
    const linkClicks=pN(row[fk('Lượt click vào liên kết','link clicks')]);
    return{postId,pageId,pageName:pageName.trim(),title,permalink,isCross,isShare,postType:postType.trim(),sponsoredStatus,date,views,reach,totalEngage,reactions,comments,shares,totalClicks,photoClicks,otherClicks,linkClicks};
  };

  const fetchData=useCallback(async()=>{
    if(!csvUrl)return;
    setLoading(true);setMsg('');
    const proxies=[{n:'direct',u:csvUrl},{n:'corsproxy',u:`https://corsproxy.io/?${encodeURIComponent(csvUrl)}`},{n:'allorigins',u:`https://api.allorigins.win/raw?url=${encodeURIComponent(csvUrl)}`}];
    for(const p of proxies){
      try{
        const r=await fetch(p.u,{redirect:'follow'});if(!r.ok)continue;
        const t=await r.text();if(!t||t.length<10)continue;
        if(t.trim().toLowerCase().startsWith('<!doctype')||t.trim().toLowerCase().startsWith('<html'))continue;
        const parsed=Papa.parse(t,{header:true,skipEmptyLines:true});
        const d=parsed.data.map(norm).filter(r=>r.pageName&&r.permalink);
        if(!d.length)continue;
        setRawData(d);setMsg(`✓ Đã tải ${d.length} bài viết`);setLoading(false);return;
      }catch(e){console.warn(e);}
    }
    setMsg('Không tải được dữ liệu');setLoading(false);
  },[csvUrl]);

  useEffect(()=>{fetchData();},[fetchData]);

  const toID=d=>d?`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`:'';

  useEffect(()=>{
    if(!rawData.length||preset==='custom')return;
    const datesWithTime=rawData.filter(r=>r.date).map(r=>r.date.getTime());
    if(!datesWithTime.length)return;
    const mx=new Date(Math.max(...datesWithTime));
    const mn=new Date(Math.min(...datesWithTime));
    let f,t;
    if(preset==='this_month'){f=new Date(mx.getFullYear(),mx.getMonth(),1);t=mx;}
    else if(preset==='last_7'){t=mx;f=new Date(mx);f.setDate(mx.getDate()-6);}
    else if(preset==='last_30'){t=mx;f=new Date(mx);f.setDate(mx.getDate()-29);}
    else if(preset==='last_month'){f=new Date(mx.getFullYear(),mx.getMonth()-1,1);t=new Date(mx.getFullYear(),mx.getMonth(),0);}
    else{f=mn;t=mx;}
    setDateFrom(toID(f));setDateTo(toID(t));
  },[rawData,preset]);

  const{curData,prevData,dateRange,prevRange}=useMemo(()=>{
    if(!rawData.length||!dateFrom||!dateTo)return{curData:[],prevData:[],dateRange:null,prevRange:null};
    const cs=new Date(dateFrom+'T00:00:00'),ce=new Date(dateTo+'T23:59:59');
    const ps=new Date(cs);ps.setMonth(ps.getMonth()-1);
    const pe=new Date(ce);pe.setMonth(pe.getMonth()-1);
    return{curData:rawData.filter(r=>r.date&&r.date>=cs&&r.date<=ce),prevData:rawData.filter(r=>r.date&&r.date>=ps&&r.date<=pe),dateRange:[cs,ce],prevRange:[ps,pe]};
  },[rawData,dateFrom,dateTo]);

  const pages=useMemo(()=>[...new Set(rawData.map(r=>r.pageName))].filter(Boolean).sort(),[rawData]);
  const postTypes=useMemo(()=>[...new Set(rawData.map(r=>r.postType))].filter(Boolean).sort(),[rawData]);

  const af=d=>d.filter(r=>(fPage==='all'||r.pageName===fPage)&&(fType==='all'||r.postType===fType));
  const filtered=useMemo(()=>af(curData),[curData,fPage,fType]);
  const filteredP=useMemo(()=>af(prevData),[prevData,fPage,fType]);

  const agg=d=>{
    const a={posts:0,reach:0,totalEngage:0,reactions:0,comments:0,shares:0,totalClicks:0,linkClicks:0};
    d.forEach(r=>{a.posts+=1;a.reach+=r.reach;a.totalEngage+=r.totalEngage;a.reactions+=r.reactions;a.comments+=r.comments;a.shares+=r.shares;a.totalClicks+=r.totalClicks;a.linkClicks+=r.linkClicks;});
    a.engageRate=a.reach?a.totalEngage/a.reach:0;
    a.commentRate=a.reach?a.comments/a.reach:0;
    return a;
  };
  const cur=useMemo(()=>agg(filtered),[filtered]);
  const prev=useMemo(()=>agg(filteredP),[filteredP]);

  // Daily series
  const dailySeries=useMemo(()=>{
    const map=new Map();
    filtered.forEach(r=>{if(!r.date)return;const k=r.date.toISOString().slice(0,10);if(!map.has(k))map.set(k,{date:r.date,posts:0,reach:0,totalEngage:0,reactions:0,comments:0,shares:0});const e=map.get(k);e.posts++;e.reach+=r.reach;e.totalEngage+=r.totalEngage;e.reactions+=r.reactions;e.comments+=r.comments;e.shares+=r.shares;});
    // Prev daily
    const prevMap=new Map();
    filteredP.forEach(r=>{if(!r.date)return;const k=r.date.toISOString().slice(0,10);if(!prevMap.has(k))prevMap.set(k,{reach:0,totalEngage:0,comments:0});const e=prevMap.get(k);e.reach+=r.reach;e.totalEngage+=r.totalEngage;e.comments+=r.comments;});
    return[...map.values()].sort((a,b)=>a.date-b.date).map(e=>{
      const pd=new Date(e.date);pd.setMonth(pd.getMonth()-1);
      const pk=pd.toISOString().slice(0,10);
      const pv=prevMap.get(pk)||{reach:0,totalEngage:0,comments:0};
      return{...e,label:fDate(e.date),engageRate:e.reach?e.totalEngage/e.reach:0,commentRate:e.reach?e.comments/e.reach:0,prevReach:pv.reach,prevTotalEngage:pv.totalEngage,prevComments:pv.comments,prevEngageRate:pv.reach?pv.totalEngage/pv.reach:0,prevCommentRate:pv.reach?pv.comments/pv.reach:0};
    });
  },[filtered,filteredP]);

  // By post type
  const byType=useMemo(()=>{
    const m=new Map();
    filtered.forEach(r=>{if(!m.has(r.postType))m.set(r.postType,{type:r.postType,posts:0,reach:0,totalEngage:0,comments:0});const e=m.get(r.postType);e.posts++;e.reach+=r.reach;e.totalEngage+=r.totalEngage;e.comments+=r.comments;});
    return[...m.values()].map(e=>({...e,avgReach:e.posts?e.reach/e.posts:0,engageRate:e.reach?e.totalEngage/e.reach:0,commentRate:e.reach?e.comments/e.reach:0})).sort((a,b)=>b.posts-a.posts);
  },[filtered]);

  // By hour
  const byHour=useMemo(()=>{
    const m=new Map();
    rawData.forEach(r=>{
      if(!r.date)return;
      const h=r.date.getHours();
      const slot=`${String(h).padStart(2,'0')}:00`;
      if(!m.has(slot))m.set(slot,{slot,posts:0,reach:0,totalEngage:0});
      const e=m.get(slot);e.posts++;e.reach+=r.reach;e.totalEngage+=r.totalEngage;
    });
    return[...m.values()].sort((a,b)=>a.slot.localeCompare(b.slot)).map(e=>({...e,avgReach:e.posts?e.reach/e.posts:0,avgEngage:e.posts?e.totalEngage/e.posts:0}));
  },[rawData]);

  // By page summary
  const byPage=useMemo(()=>{
    const m=new Map();
    filtered.forEach(r=>{if(!m.has(r.pageName))m.set(r.pageName,{page:r.pageName,posts:0,reach:0,totalEngage:0,reactions:0,comments:0,shares:0});const e=m.get(r.pageName);e.posts++;e.reach+=r.reach;e.totalEngage+=r.totalEngage;e.reactions+=r.reactions;e.comments+=r.comments;e.shares+=r.shares;});
    return[...m.values()].map(e=>({...e,engageRate:e.reach?e.totalEngage/e.reach:0,commentRate:e.reach?e.comments/e.reach:0})).sort((a,b)=>b.posts-a.posts);
  },[filtered]);

  // Reactions breakdown
  const reactionBreakdown=useMemo(()=>{
    let like=0,love=0,wow=0,haha=0,sad=0,angry=0;
    filtered.forEach(r=>{like+=r.reactions;});// Tạm dùng tổng reactions (FB API export chỉ có tổng)
    return[{name:'❤️ Like/Love',value:like,color:'#ed9ebe'}];
  },[filtered]);

  // Top 20 best posts
  const top20=useMemo(()=>[...filtered].sort((a,b)=>b.totalEngage-a.totalEngage).slice(0,20),[filtered]);

  const CHART_OPTS=[{k:'reach',l:'Tiếp cận'},{k:'totalEngage',l:'Tổng tương tác'},{k:'comments',l:'Bình luận'},{k:'reactions',l:'Cảm xúc'},{k:'engageRate',l:'Tỷ lệ TT'},{k:'commentRate',l:'Tỷ lệ BL'}];
  const isPct=chartMetric==='engageRate'||chartMetric==='commentRate';
  const fmtChart=v=>isPct?fPct(v,2):fK(v);
  const prevKey='prev'+chartMetric.charAt(0).toUpperCase()+chartMetric.slice(1);
  const gIdS='gS_'+chartMetric;

  return<div style={{padding:24}}>
    <div style={{marginBottom:24}}>
      <h1 className="df" style={{margin:0,fontSize:24,fontWeight:800,color:'var(--text)'}}>Kênh Social</h1>
      <p style={{margin:'4px 0 0',fontSize:13,color:'var(--muted)'}}>
        {dateRange?<>Kỳ: <strong style={{color:'var(--sub)'}}>{fDate(dateRange[0])} → {fDate(dateRange[1])}</strong>{prevRange&&<span> • Cùng kỳ: {fDate(prevRange[0])} → {fDate(prevRange[1])}</span>}</>:'—'}
        {loading&&<span style={{marginLeft:8,color:'var(--blue)'}}>⟳ Đang tải...</span>}
        {msg&&!loading&&<span style={{marginLeft:8,fontSize:12,color:msg.startsWith('✓')?'var(--green)':'var(--red)'}}>{msg}</span>}
      </p>
    </div>

    {/* Filters */}
    <div className="surface fu" style={{padding:20,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}><IFilter s={14}/><span style={{fontWeight:600,fontSize:13,color:'var(--sub)'}}>Bộ lọc</span></div>
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Khoảng ngày</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
          {[{v:'last_7',l:'7 ngày'},{v:'last_30',l:'30 ngày'},{v:'this_month',l:'Tháng này'},{v:'last_month',l:'Tháng trước'},{v:'all',l:'Tất cả'},{v:'custom',l:'Tùy chỉnh'}].map(p=>(
            <button key={p.v} onClick={()=>setPreset(p.v)} style={{padding:'6px 14px',borderRadius:999,fontSize:11,fontWeight:600,border:preset===p.v?'none':'1px solid rgba(15,23,42,.08)',background:preset===p.v?'linear-gradient(135deg,var(--blue),var(--purple))':'rgba(15,23,42,.03)',color:preset===p.v?'#fff':'var(--sub)',cursor:'pointer'}}>{p.l}</button>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:6}}>Từ ngày</div><input type="date" value={dateFrom} onChange={e=>{setDateFrom(e.target.value);setPreset('custom');}} className="input-soft" style={{width:'100%'}}/></div>
          <div><div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:6}}>Đến ngày</div><input type="date" value={dateTo} onChange={e=>{setDateTo(e.target.value);setPreset('custom');}} className="input-soft" style={{width:'100%'}}/></div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,paddingTop:12,borderTop:'1px solid var(--border)'}}>
        <FilterSelect label="Tên trang" value={fPage} onChange={setFPage} options={[{v:'all',l:'Tất cả trang'},...pages.map(p=>({v:p,l:p}))]}/>
        <FilterSelect label="Loại bài viết" value={fType} onChange={setFType} options={[{v:'all',l:'Tất cả loại'},...postTypes.map(p=>({v:p,l:p}))]}/>
      </div>
    </div>

    {/* KPI Cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
      <KpiCard label="Số bài đăng" value={fN(cur.posts)} sub={`CK: ${fN(prev.posts)}`} change={pctChg(cur.posts,prev.posts)} accent="#c7dafc" delay={0}/>
      <KpiCard label="Số người tiếp cận" value={fK(cur.reach)} sub={`CK: ${fK(prev.reach)}`} change={pctChg(cur.reach,prev.reach)} accent="#d9c8f7" delay={50}/>
      <KpiCard label="Tổng tương tác" value={fK(cur.totalEngage)} sub={`CK: ${fK(prev.totalEngage)}`} change={pctChg(cur.totalEngage,prev.totalEngage)} accent="#f7c8dc" delay={100}/>
      <KpiCard label="Tỷ lệ tương tác" value={fPct(cur.engageRate)} sub={`CK: ${fPct(prev.engageRate)}`} change={pctChg(cur.engageRate,prev.engageRate)} accent="#b9e6c9" delay={150}/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
      <KpiCard label="Cảm xúc" value={fK(cur.reactions)} sub={`CK: ${fK(prev.reactions)}`} change={pctChg(cur.reactions,prev.reactions)} accent="#f7c8dc" delay={0}/>
      <KpiCard label="Bình luận" value={fK(cur.comments)} sub={`CK: ${fK(prev.comments)}`} change={pctChg(cur.comments,prev.comments)} accent="#c7dafc" delay={50}/>
      <KpiCard label="Tỷ lệ bình luận" value={fPct(cur.commentRate,3)} sub={`CK: ${fPct(prev.commentRate,3)}`} change={pctChg(cur.commentRate,prev.commentRate)} accent="#d9c8f7" delay={100}/>
      <KpiCard label="Lượt chia sẻ" value={fK(cur.shares)} sub={`CK: ${fK(prev.shares)}`} change={pctChg(cur.shares,prev.shares)} accent="#b9e6c9" delay={150}/>
    </div>

    {/* Chart */}
    <div className="surface-el fu" style={{padding:24,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:16}}>
        <SectionHead icon={<IChart s={15}/>} title="Xu hướng theo ngày" sub="Đường liền: Kỳ này • Đường đứt: Cùng kỳ tháng trước"/>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {CHART_OPTS.map(o=>(
            <button key={o.k} onClick={()=>setChartMetric(o.k)} style={{padding:'5px 12px',borderRadius:999,fontSize:11,fontWeight:600,border:chartMetric===o.k?'none':'1px solid rgba(15,23,42,.08)',background:chartMetric===o.k?'linear-gradient(135deg,var(--blue),var(--purple))':'rgba(15,23,42,.03)',color:chartMetric===o.k?'#fff':'var(--sub)',cursor:'pointer'}}>{o.l}</button>
          ))}
        </div>
      </div>
      <div style={{width:'100%',height:300}}>
        <ResponsiveContainer>
          <ComposedChart data={dailySeries} margin={{top:8,right:24,left:0,bottom:0}}>
            <defs><linearGradient id={gIdS} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#5b8def" stopOpacity={0.3}/><stop offset="100%" stopColor="#5b8def" stopOpacity={0}/></linearGradient></defs>
            <CartesianGrid strokeDasharray="3 6" stroke="rgba(15,23,42,.05)" vertical={false}/>
            <XAxis dataKey="label" stroke="#94a3b8" fontSize={11} axisLine={false} tickLine={false} dy={6}/>
            <YAxis stroke="#94a3b8" fontSize={11} tickFormatter={fmtChart} axisLine={false} tickLine={false} width={60}/>
            <Tooltip contentStyle={{borderRadius:12,border:'1px solid rgba(15,23,42,.06)',fontSize:12,boxShadow:'0 8px 24px rgba(15,23,42,.08)',background:'rgba(255,255,255,.96)'}} formatter={v=>fmtChart(v)}/>
            <Legend wrapperStyle={{fontSize:12,paddingTop:10}} iconType="circle"/>
            <Area type="monotone" dataKey={chartMetric} name="Kỳ này" stroke="#5b8def" strokeWidth={2.5} fill={`url(#${gIdS})`} dot={false} activeDot={{r:5,fill:'#5b8def',strokeWidth:0}}/>
            <Line type="monotone" dataKey={prevKey} name="Cùng kỳ" stroke="#b89cf0" strokeWidth={2} strokeDasharray="5 5" dot={false} legendType="line"/>
          </ComposedChart>
        </ResponsiveContainer>
      </div>
    </div>

    {/* By Post Type */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
      <div className="surface-el fu" style={{padding:22}}>
        <SectionHead icon={<IChart s={15}/>} title="Phân tích theo Loại bài viết" sub="So sánh hiệu suất từng loại content"/>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
            <thead><tr style={{fontSize:9,textTransform:'uppercase',color:'var(--muted)',fontWeight:700,borderBottom:'1px solid var(--border)'}}>
              <th style={{textAlign:'left',padding:'6px 8px'}}>Loại</th>
              <th style={{textAlign:'right',padding:'6px 8px'}}>Bài</th>
              <th style={{textAlign:'right',padding:'6px 8px'}}>Tiếp cận TB</th>
              <th style={{textAlign:'right',padding:'6px 8px'}}>Tỷ lệ TT</th>
              <th style={{textAlign:'right',padding:'6px 8px'}}>Tỷ lệ BL</th>
            </tr></thead>
            <tbody>{byType.map((r,i)=>(
              <tr key={r.type} style={{borderBottom:'1px solid rgba(15,23,42,.04)'}}>
                <td style={{padding:'8px 8px',fontWeight:600,color:'var(--text)'}}>{r.type||'—'}</td>
                <td style={{padding:'8px 8px',textAlign:'right'}} className="ticker">{fN(r.posts)}</td>
                <td style={{padding:'8px 8px',textAlign:'right'}} className="ticker">{fK(r.avgReach)}</td>
                <td style={{padding:'8px 8px',textAlign:'right',color:'var(--blue)',fontWeight:600}} className="ticker">{fPct(r.engageRate)}</td>
                <td style={{padding:'8px 8px',textAlign:'right',color:'var(--purple)',fontWeight:600}} className="ticker">{fPct(r.commentRate,3)}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </div>

      {/* By Hour */}
      <div className="surface-el fu" style={{padding:22}}>
        <SectionHead icon={<IChart s={15}/>} title="Phân tích theo khung giờ đăng" sub="Khung giờ nào có tiếp cận cao nhất"/>
        {byHour.length>0?<div style={{width:'100%',height:200}}>
          <ResponsiveContainer>
            <BarChart data={byHour} margin={{top:4,right:8,left:0,bottom:0}}>
              <CartesianGrid strokeDasharray="3 6" stroke="rgba(15,23,42,.05)" vertical={false}/>
              <XAxis dataKey="slot" stroke="#94a3b8" fontSize={9} axisLine={false} tickLine={false}/>
              <YAxis stroke="#94a3b8" fontSize={10} tickFormatter={fK} axisLine={false} tickLine={false} width={48}/>
              <Tooltip contentStyle={{borderRadius:10,border:'1px solid rgba(15,23,42,.06)',fontSize:12}} formatter={v=>fK(v)}/>
              <Bar dataKey="avgReach" name="Tiếp cận TB" fill="#c7dafc" radius={[4,4,0,0]}>
                {byHour.map((_,i)=><Cell key={i} fill={i===byHour.reduce((mx,e,idx,arr)=>e.avgReach>arr[mx].avgReach?idx:mx,0)?'#5b8def':'#c7dafc'}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>:<div style={{textAlign:'center',padding:'40px 0',color:'var(--muted)',fontSize:13}}>Chưa có dữ liệu khung giờ</div>}
      </div>
    </div>

    {/* Top 3 Rankings */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:20}}>
      {[
        {title:'Top 5 trang nhiều bài đăng',data:[...byPage].sort((a,b)=>b.posts-a.posts).slice(0,5),key:'posts',fmt:fN,label:'bài',color:'var(--blue)'},
        {title:'Top 5 tỷ lệ bình luận cao',data:[...byPage].sort((a,b)=>b.commentRate-a.commentRate).slice(0,5),key:'commentRate',fmt:v=>fPct(v,3),label:'tỷ lệ BL',color:'var(--purple)'},
        {title:'Top 5 tỷ lệ tương tác cao',data:[...byPage].sort((a,b)=>b.engageRate-a.engageRate).slice(0,5),key:'engageRate',fmt:v=>fPct(v,2),label:'tỷ lệ TT',color:'var(--pink)'},
      ].map(({title,data,key,fmt,label,color})=>(
        <div key={title} className="surface-el fu" style={{padding:20}}>
          <div style={{fontWeight:700,fontSize:13,color:'var(--text)',marginBottom:14}} className="df">{title}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {data.map((it,i)=>{const mx=Math.max(...data.map(x=>x[key]),0.001);return<div key={it.page} style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:24,height:24,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,background:'rgba(91,141,239,.08)',color:'var(--blue)',flexShrink:0}}>{i+1}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                  <span style={{fontSize:11,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text)'}}>{it.page}</span>
                  <span style={{fontSize:11,fontWeight:700,color,flexShrink:0,marginLeft:6}} className="ticker">{fmt(it[key])}</span>
                </div>
                <div style={{height:3,borderRadius:999,background:'rgba(15,23,42,.06)',overflow:'hidden'}}><div style={{height:'100%',borderRadius:999,width:`${(it[key]/mx)*100}%`,background:color,opacity:.6}}/></div>
              </div>
            </div>;})}
          </div>
        </div>
      ))}
    </div>

    {/* Page Summary Table */}
    <div className="surface-el fu" style={{padding:24,marginBottom:20}}>
      <SectionHead icon={<IChart s={15}/>} title="Hiệu suất từng trang" sub="Tổng hợp đầy đủ chỉ số theo trang"/>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
          <thead><tr style={{fontSize:9,textTransform:'uppercase',color:'var(--muted)',fontWeight:700,borderBottom:'1px solid rgba(15,23,42,.1)'}}>
            <th style={{textAlign:'left',padding:'8px 12px'}}>Tên trang</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Số bài</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tiếp cận</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tổng TT</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tỷ lệ TT</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Bình luận</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tỷ lệ BL</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Chia sẻ</th>
          </tr></thead>
          <tbody>{byPage.map(r=>(
            <tr key={r.page} style={{borderBottom:'1px solid rgba(15,23,42,.04)'}}>
              <td style={{padding:'9px 12px',fontWeight:600,color:'var(--text)'}}>{r.page}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fN(r.posts)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.reach)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.totalEngage)}</td>
              <td style={{padding:'9px 8px',textAlign:'right',color:'var(--blue)',fontWeight:600}} className="ticker">{fPct(r.engageRate)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.comments)}</td>
              <td style={{padding:'9px 8px',textAlign:'right',color:'var(--purple)',fontWeight:600}} className="ticker">{fPct(r.commentRate,3)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.shares)}</td>
            </tr>
          ))}</tbody>
        </table>
      </div>
    </div>

    {/* Top 20 Content */}
    <div className="surface-el fu" style={{padding:24,marginBottom:24}}>
      <SectionHead icon={<IStar s={15}/>} title="Top 20 nội dung hiệu suất tốt nhất" sub="Xếp theo Tổng tương tác (Cảm xúc + Bình luận + Chia sẻ)"/>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',fontSize:12,borderCollapse:'collapse'}}>
          <thead><tr style={{fontSize:9,textTransform:'uppercase',color:'var(--muted)',fontWeight:700,borderBottom:'1px solid rgba(15,23,42,.1)'}}>
            <th style={{textAlign:'center',padding:'8px 8px',width:32}}>#</th>
            <th style={{textAlign:'left',padding:'8px 12px'}}>Tên trang</th>
            <th style={{textAlign:'left',padding:'8px 8px',maxWidth:200}}>Tiêu đề</th>
            <th style={{textAlign:'center',padding:'8px 8px'}}>Loại</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Ngày đăng</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tiếp cận</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tổng TT</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Tỷ lệ TT</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Cảm xúc</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>BL</th>
            <th style={{textAlign:'right',padding:'8px 8px'}}>Chia sẻ</th>
            <th style={{textAlign:'center',padding:'8px 8px'}}>Link</th>
          </tr></thead>
          <tbody>{top20.map((r,i)=>(
            <tr key={r.permalink+i} style={{borderBottom:'1px solid rgba(15,23,42,.04)',background:i%2===0?'transparent':'rgba(247,248,251,.4)'}}>
              <td style={{padding:'9px 8px',textAlign:'center'}}>
                <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,borderRadius:6,background:i<3?'linear-gradient(135deg,var(--blue),var(--purple))':'rgba(15,23,42,.06)',color:i<3?'#fff':'var(--muted)',fontSize:10,fontWeight:700}}>{i+1}</span>
              </td>
              <td style={{padding:'9px 12px',fontWeight:600,color:'var(--text)',whiteSpace:'nowrap'}}>{r.pageName}</td>
              <td style={{padding:'9px 8px',color:'var(--sub)',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.title||'—'}</td>
              <td style={{padding:'9px 8px',textAlign:'center'}}><span style={{fontSize:9,padding:'2px 8px',borderRadius:6,background:'rgba(91,141,239,.08)',color:'var(--blue)',fontWeight:700}}>{r.postType||'—'}</span></td>
              <td style={{padding:'9px 8px',textAlign:'right',color:'var(--muted)'}} className="ticker">{r.date?fDateFull(r.date):'—'}</td>
              <td style={{padding:'9px 8px',textAlign:'right',fontWeight:600}} className="ticker">{fK(r.reach)}</td>
              <td style={{padding:'9px 8px',textAlign:'right',fontWeight:700,color:'var(--blue)'}} className="ticker">{fK(r.totalEngage)}</td>
              <td style={{padding:'9px 8px',textAlign:'right',color:'var(--green)',fontWeight:600}} className="ticker">{fPct(r.reach?r.totalEngage/r.reach:0)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.reactions)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.comments)}</td>
              <td style={{padding:'9px 8px',textAlign:'right'}} className="ticker">{fK(r.shares)}</td>
              <td style={{padding:'9px 8px',textAlign:'center'}}>
                {r.permalink?<a href={r.permalink} target="_blank" rel="noopener noreferrer" style={{color:'var(--blue)',textDecoration:'none',fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:6,background:'rgba(91,141,239,.08)'}}>↗</a>:'—'}
              </td>
            </tr>
          ))}</tbody>
        </table>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
